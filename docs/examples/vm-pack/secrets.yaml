# Each command runs as you on the hub; its standard output becomes the
# secret's value in the sandbox group (never logged, never written to disk).
secrets:
  forge-token:
    command: example-cli auth token
    key: value
    every: 50m
  tunnel-token:
    command: devtunnel token contoso-hub --scopes connect
    key: value
    every: 12h
