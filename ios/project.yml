# XcodeGen project (https://github.com/yonaskolb/XcodeGen): `cd ios && xcodegen`
# writes Atelier.xcodeproj. The Rust core is built by build-core.sh
# (run by the pre-build phase, or by hand once before the first build).
name: Atelier
options:
  bundleIdPrefix: com.thomashorga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 8Z37ZVMJ4V
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Atelier:
    type: application
    platform: iOS
    sources:
      - path: Atelier
      - path: Core/Swift
    dependencies:
      - framework: Core/CanvasMobileCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - name: Build the Rust core
        script: |
          if [ "${ATELIER_SKIP_CORE:-${COPILOT_CANVAS_SKIP_CORE:-}}" = "1" ]; then exit 0; fi # rename:keep (the old name still works)
          "${SRCROOT}/build-core.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Atelier/Info.plist
      properties:
        CFBundleDisplayName: Atelier
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Scan the pairing QR code that `atelier remote pair --qr` shows on your Cloud PC.
        NSFaceIDUsageDescription: Atelier locks with Face ID because a paired phone can run anything on your Cloud PC.
        NSLocalNetworkUsageDescription: Connect to an Atelier service (or the mock service) on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          # Pairing links: atelier:// (what services write since the rename)
          # and ccanvas:// (older services, printed QR codes).
          - CFBundleURLName: com.thomashorga.copilotcanvas.pair
            CFBundleURLSchemes: [atelier, ccanvas]
        ITSAppUsesNonExemptEncryption: false
        # Silent notifications bring renewed tunnel tokens while the app is away.
        UIBackgroundModes: [remote-notification]
        NSPhotoLibraryUsageDescription: Send a picture from your library to an agent (it is pasted into the session).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashorga.copilotcanvas
        PRODUCT_NAME: Atelier
        CODE_SIGN_ENTITLEMENTS: Atelier/Atelier.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: ["-lresolv"]
  AtelierTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AtelierTests]
    dependencies:
      - target: Atelier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashorga.copilotcanvas.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  # Needs the mock service: `cargo run -p canvas-mock` (127.0.0.1:47600).
  AtelierUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AtelierUITests]
    dependencies:
      - target: Atelier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashorga.copilotcanvas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atelier
schemes:
  Atelier:
    build:
      targets:
        Atelier: all
        AtelierTests: [test]
        AtelierUITests: [test]
    test:
      targets: [AtelierTests, AtelierUITests]
