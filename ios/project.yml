# XcodeGen project (https://github.com/yonaskolb/XcodeGen): `cd ios && xcodegen`
# writes CopilotCanvas.xcodeproj. The Rust core is built by build-core.sh
# (run by the pre-build phase, or by hand once before the first build).
name: CopilotCanvas
options:
  bundleIdPrefix: com.thomashorga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 8Z37ZVMJ4V
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  CopilotCanvas:
    type: application
    platform: iOS
    sources:
      - path: CopilotCanvas
      - path: Core/Swift
    dependencies:
      - framework: Core/CanvasMobileCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build the Rust core
        script: |
          if [ "${COPILOT_CANVAS_SKIP_CORE:-}" = "1" ]; then exit 0; fi
          "${SRCROOT}/build-core.sh"
        basedOnDependencyAnalysis: false
    info:
      path: CopilotCanvas/Info.plist
      properties:
        CFBundleDisplayName: Canvas
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Scan the pairing QR code that `copilot-canvas remote pair --qr` shows on your Cloud PC.
        NSFaceIDUsageDescription: Canvas locks with Face ID because a paired phone can run anything on your Cloud PC.
        NSLocalNetworkUsageDescription: Connect to a Copilot Canvas service (or the mock service) on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.thomashorga.copilotcanvas.pair
            CFBundleURLSchemes: [ccanvas]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashorga.copilotcanvas
        PRODUCT_NAME: CopilotCanvas
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: ["-lresolv"]
  CopilotCanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CopilotCanvasTests]
    dependencies:
      - target: CopilotCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashorga.copilotcanvas.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal
  # Needs the mock service: `cargo run -p canvas-mock` (127.0.0.1:47600).
  CopilotCanvasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CopilotCanvasUITests]
    dependencies:
      - target: CopilotCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomashorga.copilotcanvas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CopilotCanvas
schemes:
  CopilotCanvas:
    build:
      targets:
        CopilotCanvas: all
        CopilotCanvasTests: [test]
        CopilotCanvasUITests: [test]
    test:
      targets: [CopilotCanvasTests, CopilotCanvasUITests]
