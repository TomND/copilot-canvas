[package]
name = "canvas-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "GPU front end of the canvas (wgpu + winit + glyphon)"

[[bin]]
name = "copilot-canvas-gui"
path = "src/main.rs"

[dependencies]
canvas-agents.workspace = true
canvas-common.workspace = true
canvas-core.workspace = true
canvas-termview.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
crossbeam-channel.workspace = true
glyphon.workspace = true
png.workspace = true
pollster.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
wgpu.workspace = true
winit.workspace = true
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Com", "UI_Notifications", "Data_Xml_Dom", "Foundation_Collections"] }
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Ole"] }
