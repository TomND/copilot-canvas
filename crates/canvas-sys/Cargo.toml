[package]
name = "canvas-sys"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The platform layer: processes, local IPC, private files, secrets, spawning and host facts on Windows, macOS and Linux"

# Desktop only: the iPhone core (canvas-mobile) never depends on this crate,
# so nothing here reaches iOS (docs/MAC-LINUX-PLAN.md D1).

[dependencies]
canvas-common.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The Secret Service (GNOME Keyring, KWallet, KeePassXC) over D-Bus for the
# master key (MAC-LINUX-PLAN §5.4); D-H session encryption in pure Rust.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSString"] }
objc2-app-kit = { version = "0.2.2", features = ["NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }

[build-dependencies]
cfg_aliases.workspace = true

[dev-dependencies]
uuid.workspace = true
