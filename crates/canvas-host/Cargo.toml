[package]
name = "canvas-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L1 terminal host: ConPTY sessions, terminal emulation, frames and input encoding"

[features]
# libghostty-vt engine (Phase 2); build the library first with `cargo xtask build-ghostty`.
ghostty = ["dep:ghostty-vt-sys"]

[dependencies]
canvas-common.workspace = true
canvas-sys.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
ghostty-vt-sys = { path = "../ghostty-vt-sys", optional = true }
png.workspace = true
portable-pty.workspace = true
unicode-width.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
postcard.workspace = true
