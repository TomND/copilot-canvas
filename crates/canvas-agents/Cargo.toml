[package]
name = "canvas-agents"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "L3 canvas backend: session history, agent CLIs, event bus, passive sessions, automations, VS Code"

[dependencies]
canvas-common.workspace = true
canvas-host.workspace = true
canvas-model.workspace = true
canvas-push.workspace = true
anyhow.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
percent-encoding.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
yaml-rust2.workspace = true
canvas-sys.workspace = true
# The satellite's link (`wss://` to the hub, `vm::tls`) on every OS: rustls
# with ring and the platform's roots (a pack's own CA added to them).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-sys.workspace = true

# `vm::aca` (the sandboxes' REST API), with the TLS canvas-push uses: the
# system's on macOS and Windows, rustls with ring on Linux (no OpenSSL;
# rustls itself is above).
[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "rustls-no-provider"] }

[dev-dependencies]
portable-pty.workspace = true