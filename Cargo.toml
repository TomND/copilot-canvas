[workspace]
members = ["crates/*"]
# `cargo build` builds both executables: copilot-canvas.exe and copilot-canvas-gui.exe.
default-members = [".", "crates/canvas-gui"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false

[workspace.dependencies]
canvas-common = { path = "crates/canvas-common" }
canvas-host = { path = "crates/canvas-host" }
canvas-model = { path = "crates/canvas-model" }
canvas-agents = { path = "crates/canvas-agents" }
canvas-termview = { path = "crates/canvas-termview" }
canvas-core = { path = "crates/canvas-core" }
canvas-tui = { path = "crates/canvas-tui" }
canvas-corpus = { path = "crates/canvas-corpus" }
canvas-gui = { path = "crates/canvas-gui" }

alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Time", "Win32_System_Variant"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
yaml-rust2 = "0.13.0"
zstd = { version = "0.14.3", default-features = false }
# GPU front end (canvas-gui).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = "0.30.13"
glyphon = "0.12.0"
pollster = "0.4.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
png = "0.18.1"

[package]
name = "copilot-canvas"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Spatial session manager for agent CLIs (GitHub Copilot, OpenCode, Claude Code) with a persistent native terminal service"

[[bin]]
name = "copilot-canvas"
path = "src/main.rs"

[features]
# The default terminal engine is libghostty-vt (build the library once with
# `cargo xtask build-ghostty`); `--no-default-features` builds with alacritty only.
default = ["ghostty"]
ghostty = ["canvas-host/ghostty"]

[dependencies]
canvas-common.workspace = true
canvas-host.workspace = true
canvas-model.workspace = true
canvas-agents.workspace = true
canvas-core.workspace = true
canvas-tui.workspace = true
canvas-corpus.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
portable-pty.workspace = true
postcard.workspace = true
ratatui.workspace = true
serde_json.workspace = true
uuid.workspace = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
