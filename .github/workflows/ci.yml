# Continuous integration (PLAN.md §5 "Every phase ends green", §11 "Pin Zig;
# cache the lib by checksum; a separate CI job"). Windows: ConPTY, named
# pipes and job objects are part of what is tested; macOS (MAC-LINUX-PLAN
# §7.2): Unix PTYs, Unix sockets and the libproc process table.
name: ci

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: "b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428"
  # zig-aarch64-macos-0.17.0.tar.xz (ziglang.org/download/index.json).
  ZIG_SHA256_MACOS: "b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a"

jobs:
  # Builds the pinned libghostty-vt once per pin; the library is cached by the
  # checksum file that holds the Ghostty commit and Zig version.
  ghostty:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/ghostty
          key: ghostty-${{ hashFiles('crates/ghostty-vt-sys/vendor/CHECKSUMS.sha256') }}
      - name: Install Zig ${{ env.ZIG_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\zig.zip"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:ZIG_SHA256) { throw "Zig checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "ZIG=$env:RUNNER_TEMP\zig-x86_64-windows-$env:ZIG_VERSION\zig.exe" >> $env:GITHUB_ENV
      - name: cargo xtask build-ghostty
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask build-ghostty
      - uses: actions/upload-artifact@v7
        with:
          name: ghostty
          path: target/ghostty

  test:
    needs: ghostty
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The Rust cache first: when it restores a partial match (Cargo.lock
      # changed) it cleans target/, which would remove the library below.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty
          path: target/ghostty
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes canvas-core's ViewModel snapshot tests (tests/view_snapshots.rs):
      # fixed inputs, so they are the same on every machine.
      - name: unit and integration tests
        run: cargo test --workspace
      - name: alacritty-only build (no Zig)
        run: cargo build --no-default-features
      - name: release build
        run: cargo build --release
      - name: golden corpus (both engines)
        run: target\release\copilot-canvas.exe corpus check
      - name: TUI self-test
        run: target\release\copilot-canvas.exe selftest
      - name: TUI self-test over loopback TCP
        run: target\release\copilot-canvas.exe selftest --remote loopback
      - name: remote fault injection
        run: target\release\copilot-canvas.exe selftest --remote faults
      - name: pairing and the Dev Tunnel stand-in
        run: target\release\copilot-canvas.exe selftest --remote paired
      # The GUI runs on WARP (no GPU on hosted runners); offscreen rendering and
      # the test hooks need no interactive desktop.
      - name: GUI self-test
        run: target\release\copilot-canvas.exe selftest --client gui
      - name: GUI parity suite
        run: target\release\copilot-canvas.exe selftest --client gui --parity
      # The goldens were captured on the reference machine (RTX 3070, 125 % DPI,
      # its font versions). Hosted runners draw with WARP at 100 % DPI, so the
      # size and anti-aliasing differ and this step may fail there without a
      # regression: it reports, it does not block. The diff images are kept.
      - name: GUI golden screenshots (reference machine only)
        continue-on-error: true
        run: target\release\copilot-canvas.exe selftest --client gui --golden
      - name: keep golden diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs
          path: |
            tests/golden/gui/*.actual.png
            tests/golden/gui/*.diff.png
          if-no-files-found: ignore

  # libghostty-vt for macOS (Apple silicon), cached by the pin like Windows'.
  ghostty-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/ghostty
          key: ghostty-apple-darwin-universal-${{ hashFiles('crates/ghostty-vt-sys/vendor/CHECKSUMS.sha256') }}
      - name: Install Zig ${{ env.ZIG_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-macos-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256_MACOS  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-aarch64-macos-$ZIG_VERSION/zig" >> "$GITHUB_ENV"
      # Both slices of the universal app (x86_64 cross-compiled by Zig).
      - name: cargo xtask build-ghostty (aarch64 and x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-ghostty --target aarch64-apple-darwin
          cargo xtask build-ghostty --target x86_64-apple-darwin
          rm -rf target/ghostty/src-* target/ghostty/zig-cache
      - uses: actions/upload-artifact@v7
        with:
          name: ghostty-macos
          path: target/ghostty

  # The desktop app on macOS (MAC-LINUX-PLAN §7.2): clippy, the workspace
  # tests with Ghostty, the alacritty-only build. Secrets use the key file
  # (no Keychain prompts on a runner).
  macos:
    needs: ghostty-macos
    runs-on: macos-15
    env:
      COPILOT_CANVAS_SECRETS: file
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty-macos
          path: target/ghostty
      - name: clippy
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings
      - name: unit and integration tests
        run: cargo test --workspace
      - name: alacritty-only build (no Zig)
        run: cargo build --no-default-features
      # Debug builds (dependencies at opt-level 2): the TUI and GUI binaries.
      - name: build
        run: cargo build
      - name: golden corpus (both engines)
        run: target/debug/copilot-canvas corpus check
      - name: TUI self-test
        run: target/debug/copilot-canvas selftest
      - name: TUI self-test over loopback TCP
        run: target/debug/copilot-canvas selftest --remote loopback
      - name: remote fault injection
        run: target/debug/copilot-canvas selftest --remote faults
      - name: pairing and the Dev Tunnel stand-in
        run: target/debug/copilot-canvas selftest --remote paired
      # The GPU client on Metal (Apple-silicon runners have a paravirtual GPU).
      - name: GUI self-test
        run: target/debug/copilot-canvas selftest --client gui
      - name: GUI self-test over loopback TCP
        run: target/debug/copilot-canvas selftest --client gui --remote loopback
      # Automations on launchd (a probe task with its own label, removed at
      # the end) and the service started at login by a LaunchAgent.
      - name: automations self-test on launchd
        run: COPILOT_CANVAS_SCHEDULER=launchd target/debug/copilot-canvas selftest automations
      - name: service install (LaunchAgent)
        run: |
          home="$(mktemp -d)"
          target/debug/copilot-canvas --home "$home" service install
          for i in $(seq 1 60); do target/debug/copilot-canvas --home "$home" service status 2>/dev/null | grep -q '"running": true' && break; sleep 0.5; done
          target/debug/copilot-canvas --home "$home" service status | grep -q '"running": true'
          target/debug/copilot-canvas --home "$home" service uninstall
          target/debug/copilot-canvas --home "$home" service status | grep -q '"running": true'
          target/debug/copilot-canvas --home "$home" service stop
          ! launchctl list | grep -q com.copilot-canvas.service
      # The GPU client's budgets (PLAN §9) need a screen nobody covers or
      # locks (macOS presents nothing to a covered window): measured here on a
      # release build, advisory (a shared runner's paravirtual GPU).
      - name: release build
        run: cargo build --release
      - name: "terminal bench, 100 streaming terminals (advisory)"
        continue-on-error: true
        run: target/release/copilot-canvas bench --terminals 100 --json bench-terminals-macos.json
      - name: keep the terminal bench
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-terminals-macos
          path: bench-terminals-macos.json
          if-no-files-found: ignore
      - name: GUI bench (advisory)
        continue-on-error: true
        run: CANVAS_GUI_TEST_VISIBLE=1 target/release/copilot-canvas bench --client gui --json gui-bench-macos.json
      # Every PARITY.md row, blocking. Rows that count frames (7b, V3, 47)
      # need presents: the runner has them.
      - name: GUI parity suite
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          mkdir -p "$RUNNER_TEMP/gui-screens/parity"
          CANVAS_GUI_SCREENS="$RUNNER_TEMP/gui-screens/parity" CANVAS_GUI_TEST_VISIBLE=1 target/release/copilot-canvas selftest --client gui --parity
      - name: GUI hardening checks
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          mkdir -p "$RUNNER_TEMP/gui-screens/hardening"
          CANVAS_GUI_SCREENS="$RUNNER_TEMP/gui-screens/hardening" CANVAS_GUI_TEST_VISIBLE=1 target/release/copilot-canvas selftest --client gui --hardening
      # macOS's own golden screenshots (scale 1, the runner's paravirtual GPU
      # and Apple's fonts): recorded into tests/golden/gui/macos-1x while the
      # set is missing (an artifact to review and commit), compared from then on.
      - name: GUI golden screenshots (macOS set)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          dir="$PWD/tests/golden/gui/macos-1x"
          if [ -d "$dir" ]; then
            CANVAS_GOLDEN_DIR="$dir" CANVAS_GUI_TEST_VISIBLE=1 target/release/copilot-canvas selftest --client gui --golden
          else
            mkdir -p "$dir"
            CANVAS_GOLDEN_DIR="$dir" CANVAS_GUI_TEST_VISIBLE=1 target/release/copilot-canvas selftest --client gui --golden --update
          fi
      - name: keep the macOS goldens, screenshots and GUI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-gui
          path: |
            tests/golden/gui/macos-1x
            ${{ runner.temp }}/gui-screens
          if-no-files-found: ignore
      - name: keep the GUI bench
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-bench-macos
          path: gui-bench-macos.json
          if-no-files-found: ignore

  # The macOS app as users get it (MAC-LINUX-PLAN §8.1): the universal
  # Copilot Canvas.app and its DMG, signed and notarized once the owner's
  # Developer ID secrets exist (ad hoc signed until then), installed from the
  # DMG and run (the Intel slice under Rosetta too), and the Homebrew cask
  # installed from a local tap.
  macos-package:
    needs: ghostty-macos
    runs-on: macos-15
    env:
      COPILOT_CANVAS_SECRETS: file
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty-macos
          path: target/ghostty
      - name: Rust targets and Rosetta
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          softwareupdate --install-rosetta --agree-to-license || true
      - name: build the universal app and DMG
        run: packaging/macos/build.sh
      - name: sign and notarize (skipped without the owner's secrets)
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: packaging/macos/sign.sh
      - name: install from the DMG and run (TUI and GUI self-tests from the bundle)
        run: packaging/macos/smoke.sh target/macos-package/CopilotCanvas-*-macos-universal.dmg --gui
      - name: the Homebrew cask from a local tap
        run: |
          dmg="$(ls "$PWD"/target/macos-package/CopilotCanvas-*-macos-universal.dmg)"
          brew tap-new --no-git local/canvas
          tap="$(brew --repository local/canvas)"
          mkdir -p "$tap/Casks"
          sed -e "s|^  url .*|  url \"file://$dmg\"|" target/macos-package/Casks/copilot-canvas.rb > "$tap/Casks/copilot-canvas.rb"
          brew install --cask local/canvas/copilot-canvas
          copilot-canvas --version
          copilot-canvas --home "$(mktemp -d)" doctor || true
          brew uninstall --cask local/canvas/copilot-canvas
          ! test -e "$(brew --prefix)/bin/copilot-canvas"
          brew untap local/canvas
      - name: keep the DMG and the cask
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: |
            target/macos-package/*.dmg
            target/macos-package/*.sha256
            target/macos-package/Casks
          if-no-files-found: ignore

  # The iPhone app (docs/IOS-PLAN.md): the portable crates on macOS, the Rust
  # core for iOS, the app on a simulator with its unit tests and its UI tests
  # against the mock service.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: portable crates (clippy, tests)
        run: |
          rustup component add clippy
          cargo clippy -p canvas-common -p canvas-model -p canvas-termview -p canvas-push -p canvas-mobile -p canvas-mock --all-targets -- -D warnings
          cargo clippy -p canvas-host --no-default-features --all-targets -- -D warnings
          cargo test -p canvas-common -p canvas-model -p canvas-termview -p canvas-push -p canvas-mobile -p canvas-mock
          cargo test -p canvas-host --no-default-features
      - name: the Rust core for iOS
        run: ios/build-core.sh
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen
      # The UI tests pair with two mock services and wait for their first data:
      # both mocks listen and the simulator has booted before any test starts
      # (a cold boot during the first test ate its waits), one simulator at a
      # time, and a failure keeps the result bundle and the mocks' logs.
      - name: app tests on a simulator (unit, and UI against the mock)
        run: |
          cargo build -p canvas-mock
          logs="$RUNNER_TEMP/ios-logs"
          mkdir -p "$logs"
          target/debug/canvas-mock --quiet > "$logs/mock.log" 2>&1 &
          target/debug/canvas-mock --quiet --listen 127.0.0.1:47601 --state "$RUNNER_TEMP/canvas-mock-personal" > "$logs/mock-personal.log" 2>&1 &
          for port in 47600 47601; do
            for i in $(seq 1 120); do nc -z 127.0.0.1 "$port" && break; sleep 0.5; done
            nc -z 127.0.0.1 "$port" || { echo "the mock on port $port does not listen"; cat "$logs"/*.log; exit 1; }
          done
          echo "both mocks listen"
          # An iPhone 16 when the runner image has one, else its first iPhone simulator.
          DEVICE="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          fi
          UDID=$(xcrun simctl list devices available | grep -m1 "    $DEVICE (" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "simulator: $DEVICE ($UDID)"
          # The on-screen keyboard (a connected hardware keyboard hides it; the tests look for it).
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # iOS's one-time slide-to-type tip would cover the keyboard and the
          # app's key bar the first time it shows (the tests close it too).
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          cd ios
          COPILOT_CANVAS_SKIP_CORE=1 xcodebuild -project CopilotCanvas.xcodeproj -scheme CopilotCanvas \
            -destination "platform=iOS Simulator,id=$UDID" -parallel-testing-enabled NO \
            -resultBundlePath "$logs/tests.xcresult" test
      - name: keep the iOS test results and the mocks' logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests
          path: ${{ runner.temp }}/ios-logs
          if-no-files-found: ignore

  # libghostty-vt for Linux (glibc 2.35 floor), one per architecture, cached
  # by the pin's checksum file and the target triple.
  ghostty-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            zig_sha256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            zig_sha256: "9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/ghostty
          key: ghostty-${{ matrix.arch }}-unknown-linux-gnu-${{ hashFiles('crates/ghostty-vt-sys/vendor/CHECKSUMS.sha256') }}
      - name: Install Zig ${{ env.ZIG_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-${{ matrix.arch }}-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${{ matrix.zig_sha256 }}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-${{ matrix.arch }}-linux-$ZIG_VERSION/zig" >> "$GITHUB_ENV"
      - name: cargo xtask build-ghostty --target ${{ matrix.arch }}-unknown-linux-gnu
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-ghostty --target ${{ matrix.arch }}-unknown-linux-gnu
          rm -rf target/ghostty/src-* target/ghostty/zig-cache
      - uses: actions/upload-artifact@v7
        with:
          name: ghostty-linux-${{ matrix.arch }}
          path: target/ghostty

  # Linux (docs/MAC-LINUX-PLAN.md §7.2): the whole workspace with Ghostty on
  # the glibc 2.35 floor (Ubuntu 22.04), on Ubuntu 24.04 and on arm64, the
  # alacritty-only build, the corpus and the TUI self-tests. Separate from the
  # Windows jobs so they keep their time.
  linux:
    needs: ghostty-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RUST_BACKTRACE: "1"
      COPILOT_CANVAS_SECRETS: file
    steps:
      - uses: actions/checkout@v7
      # The Rust cache first: when it restores a partial match it cleans
      # target/, which would remove the library below.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty-linux-${{ matrix.arch }}
          path: target/ghostty
      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig1-dev xvfb xauth xclip \
            dbus dbus-x11 gnome-keyring cron
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: unit and integration tests
        run: cargo test --workspace
      # The master key in a real Secret Service: GNOME Keyring on a private
      # session bus, unlocked with a throw-away password; the test deletes
      # its items, and the bus and keyring end with the step.
      - name: Secret Service backend
        run: |
          dbus-run-session -- sh -c 'printf runner | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
            COPILOT_CANVAS_SECRET_SERVICE_TESTS=1 cargo test -p canvas-sys --lib secret -- --nocapture'
      - name: alacritty-only build (no Zig)
        if: ${{ !cancelled() }}
        run: cargo build --no-default-features
      - name: release build
        if: ${{ !cancelled() }}
        run: cargo build --release
      # The self-tests run every step even when one before failed (each is
      # independent), so one run shows them all. The TUI's copy and paste use
      # the X11 clipboard (xclip) of a virtual display.
      - name: golden corpus (both engines)
        if: ${{ !cancelled() }}
        run: target/release/copilot-canvas corpus check
      - name: doctor
        if: ${{ !cancelled() }}
        run: target/release/copilot-canvas doctor || true
      - name: TUI self-test
        if: ${{ !cancelled() }}
        run: xvfb-run -a target/release/copilot-canvas selftest
      - name: TUI self-test over loopback TCP
        if: ${{ !cancelled() }}
        run: xvfb-run -a target/release/copilot-canvas selftest --remote loopback
      - name: remote fault injection
        if: ${{ !cancelled() }}
        run: xvfb-run -a target/release/copilot-canvas selftest --remote faults
      - name: pairing and the Dev Tunnel stand-in
        if: ${{ !cancelled() }}
        run: xvfb-run -a target/release/copilot-canvas selftest --remote paired
      # Automations on the runner's real schedulers; the probe task is
      # removed at the end of each run (also on failure).
      - name: automations on a user systemd
        if: ${{ !cancelled() }}
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 40); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 0.5; done
          COPILOT_CANVAS_SCHEDULER=systemd target/release/copilot-canvas selftest automations
          # service install: the unit starts the service, which answers; then it goes away.
          home="$RUNNER_TEMP/service-home"
          target/release/copilot-canvas --home "$home" service install
          cat "$HOME/.config/systemd/user/copilot-canvas.service"
          systemctl --user start copilot-canvas.service
          for i in $(seq 1 60); do target/release/copilot-canvas --home "$home" service status 2>/dev/null | grep -q '"running": true' && break; sleep 0.5; done
          systemctl --user status copilot-canvas.service --no-pager || true
          tail -30 "$home/service-default.log" || true
          ls -la "$home" "$home/run" || true
          target/release/copilot-canvas --home "$home" service status
          target/release/copilot-canvas --home "$home" service stop
          target/release/copilot-canvas --home "$home" service uninstall
          test ! -e "$HOME/.config/systemd/user/copilot-canvas.service"
      # The service started by the client as a transient systemd user unit
      # (the user manager runs since the step above enabled lingering).
      - name: TUI self-test with the service in a user unit (systemd-run)
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          home="$RUNNER_TEMP/unit-home"
          target/release/copilot-canvas --home "$home" service start
          systemctl --user is-active copilot-canvas-default.service
          target/release/copilot-canvas --home "$home" service stop
          xvfb-run -a target/release/copilot-canvas selftest
      - name: automations on cron
        if: ${{ !cancelled() }}
        run: |
          sudo systemctl start cron || sudo service cron start
          COPILOT_CANVAS_SCHEDULER=cron target/release/copilot-canvas selftest automations
      # PLAN §9's service numbers: keystroke → screen through a real PTY
      # while 100 terminals stream, memory per terminal, the service's CPU.
      # Advisory on shared runners; the JSON is kept.
      - name: "terminal bench, 100 streaming terminals (advisory)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: target/release/copilot-canvas bench --terminals 100 --json "$RUNNER_TEMP/bench-terminals.json"
      - name: keep the terminal bench
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-terminals-${{ matrix.runner }}
          path: ${{ runner.temp }}/bench-terminals.json
          if-no-files-found: ignore
      # The real agent TUIs (no sign-in, nothing submitted): a multi-line paste
      # reaches OpenCode's and Claude Code's input boxes as one paste through
      # a Linux PTY (docs/AGENTS.md, Pasting). Advisory: the CLIs come from npm.
      - name: "doctor with agents, real-agent paste check: OpenCode and Claude Code (advisory)"
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-24.04' }}
        continue-on-error: true
        run: |
          npm install -g --silent opencode-ai@1.19.4 || npm install -g --silent opencode-ai
          npm install -g --silent @anthropic-ai/claude-code@2.1.309 || npm install -g --silent @anthropic-ai/claude-code
          opencode --version; claude --version
          status=0
          target/release/copilot-canvas doctor || status=1
          xvfb-run -a target/release/copilot-canvas selftest agent --agent opencode --paste || status=1
          xvfb-run -a target/release/copilot-canvas selftest agent --agent claude --paste || status=1
          exit $status
      - name: keep logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs-${{ matrix.runner }}
          path: |
            /tmp/copilot-canvas-*/**/*.log
            /tmp/copilot-canvas-*/**/*.json
            /tmp/copilot-canvas-*/**/*.yaml
            ${{ runner.temp }}/**/*.log
          if-no-files-found: ignore

  # The GUI on Linux (MAC-LINUX-PLAN §7.2): the self-test under X11 (Xvfb)
  # and under a headless Wayland compositor (weston), rendering on Mesa's
  # software Vulkan (lavapipe) or GL (llvmpipe), with a private session bus;
  # Linux's goldens, the hardening checks and the full parity suite (X11; the
  # touchpad rows and 41b also under Wayland) block, the bench reports.
  # Stderr logs and screenshots are kept.
  linux-gui:
    needs: ghostty-linux
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: "1"
      COPILOT_CANVAS_SECRETS: file
      CANVAS_GUI_SCREENS: ${{ github.workspace }}/gui-screens
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty-linux-x86_64
          path: target/ghostty
      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libvulkan1 libvulkan-dev mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 \
            xvfb xauth xclip wl-clipboard weston dbus dbus-x11 at-spi2-core openbox tint2 x11-utils \
            libwebkit2gtk-4.1-0 bubblewrap xdg-dbus-proxy \
            fonts-dejavu-core fonts-noto-core fonts-noto-color-emoji fonts-noto-cjk libfontconfig1-dev
      - name: release build
        run: cargo build --release
      - name: vulkaninfo (software adapters)
        continue-on-error: true
        run: |
          sudo apt-get install -y -q --no-install-recommends vulkan-tools >/dev/null
          vulkaninfo --summary 2>&1 | head -40
      - name: GUI self-test on X11 (Xvfb)
        run: |
          mkdir -p "$CANVAS_GUI_SCREENS/x11"
          unset WAYLAND_DISPLAY
          CANVAS_GUI_SCREENS="$CANVAS_GUI_SCREENS/x11" timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" \
            dbus-run-session -- target/release/copilot-canvas selftest --client gui
      - name: GUI self-test on X11 over loopback TCP
        if: ${{ !cancelled() }}
        run: |
          unset WAYLAND_DISPLAY
          timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- target/release/copilot-canvas selftest --client gui --remote loopback
      - name: GUI self-test on Wayland (headless weston)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$CANVAS_GUI_SCREENS/wayland"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=wl-ci --idle-time=0 --width=1920 --height=1080 > "$RUNNER_TEMP/weston.log" 2>&1 &
          for i in $(seq 1 40); do [ -S "$XDG_RUNTIME_DIR/wl-ci" ] && break; sleep 0.25; done
          unset DISPLAY
          CANVAS_GUI_SCREENS="$CANVAS_GUI_SCREENS/wayland" WAYLAND_DISPLAY=wl-ci timeout 900 \
            dbus-run-session -- target/release/copilot-canvas selftest --client gui
      # The HTML report view (WebKitGTK offscreen in its helper): parity row 41b
      # on X11 and on Wayland; the touchpad rows T1/T2 on Wayland (D15).
      - name: HTML report view on X11 (parity 41b)
        if: ${{ !cancelled() }}
        run: |
          unset WAYLAND_DISPLAY
          CANVAS_PARITY_ROWS=41b timeout 600 xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- target/release/copilot-canvas selftest --client gui --parity
      - name: HTML report view and touchpad rows on Wayland (parity 41b, T1, T2)
        if: ${{ !cancelled() }}
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --renderer=pixman --socket=wl-41b --idle-time=0 --width=1920 --height=1080 > "$RUNNER_TEMP/weston-41b.log" 2>&1 &
          for i in $(seq 1 40); do [ -S "$XDG_RUNTIME_DIR/wl-41b" ] && break; sleep 0.25; done
          unset DISPLAY
          CANVAS_PARITY_ROWS=41b,T1,T2 WAYLAND_DISPLAY=wl-41b timeout 600 dbus-run-session -- target/release/copilot-canvas selftest --client gui --parity
      # Linux's own golden screenshots (X11, scale 1, lavapipe, the runner's
      # fonts): recorded once into tests/golden/gui/linux-1x (kept as an
      # artifact to review and commit), compared from then on.
      - name: GUI golden screenshots on X11 (Linux set)
        if: ${{ !cancelled() }}
        run: |
          dir="$PWD/tests/golden/gui/linux-1x"
          unset WAYLAND_DISPLAY
          if [ -d "$dir" ]; then
            CANVAS_GOLDEN_DIR="$dir" timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- target/release/copilot-canvas selftest --client gui --golden
          else
            mkdir -p "$dir"
            CANVAS_GOLDEN_DIR="$dir" timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- target/release/copilot-canvas selftest --client gui --golden --update
          fi
      - name: keep the Linux goldens and their diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-goldens
          path: tests/golden/gui/linux-1x
          if-no-files-found: ignore
      # Under a window manager (openbox) with a panel (tint2): on a bare X
      # server nothing maximizes a window, and the panel's strut makes the
      # work area smaller than the screen (placement keeps out of it). The
      # accessibility check reads the tree over AT-SPI.
      - name: GUI hardening checks on X11
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$CANVAS_GUI_SCREENS/hardening"
          unset WAYLAND_DISPLAY
          CANVAS_GUI_SCREENS="$CANVAS_GUI_SCREENS/hardening" timeout 1200 xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- \
            sh -c 'openbox --sm-disable >/dev/null 2>&1 & sleep 1; tint2 >/dev/null 2>&1 & sleep 1; xprop -root _NET_WORKAREA || true; exec target/release/copilot-canvas selftest --client gui --hardening'
      - name: "GUI bench on X11 (advisory: software rendering on a shared runner)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          unset WAYLAND_DISPLAY
          timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- target/release/copilot-canvas bench --client gui --json "$CANVAS_GUI_SCREENS/bench-gui-x11.json"
      - name: GUI parity suite on X11
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$CANVAS_GUI_SCREENS/parity"
          unset WAYLAND_DISPLAY
          CANVAS_GUI_SCREENS="$CANVAS_GUI_SCREENS/parity" timeout 1800 xvfb-run -a -s "-screen 0 1920x1080x24" \
            dbus-run-session -- target/release/copilot-canvas selftest --client gui --parity
      - name: keep GUI logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-gui
          path: |
            ${{ github.workspace }}/gui-screens
            /tmp/copilot-canvas-selftest-*/gui-stderr.log
            /tmp/copilot-canvas-selftest-*/home/*.log
            /tmp/copilot-canvas-parity-*/*.log
            /tmp/copilot-canvas-parity-*/home/*.log
            /tmp/copilot-canvas-hardening-*/*.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore

  # Linux packages (MAC-LINUX-PLAN §8.2): tarball, AppImage, .deb and .rpm per
  # architecture, built on the glibc 2.35 floor (Ubuntu 22.04), kept as
  # artifacts.
  linux-package:
    needs: ghostty-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty-linux-${{ matrix.arch }}
          path: target/ghostty
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkg-config libssl-dev imagemagick rpm file
      - name: release build
        run: cargo build --release
      - name: packages
        run: packaging/linux/build.sh --arch ${{ matrix.arch }} --bin target/release --out dist
      - name: what the binaries link
        run: |
          ldd target/release/copilot-canvas target/release/copilot-canvas-gui
          objdump -T target/release/copilot-canvas-gui | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist

  # The packages installed on clean runners and a Fedora container, then run:
  # versions, doctor, the TUI self-test (and the GUI's on Ubuntu 24.04).
  linux-package-test:
    needs: linux-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04
            arch: x86_64
            gui: true
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      COPILOT_CANVAS_SECRETS: file
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist
      - name: .deb installs and runs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/copilot-canvas_*.deb xvfb xauth xclip
          copilot-canvas --version
          copilot-canvas-gui --version
          copilot-canvas doctor || true
          xvfb-run -a copilot-canvas selftest
      - name: the GUI from the .deb
        if: matrix.gui
        run: |
          sudo apt-get install -y -q dbus-x11 mesa-vulkan-drivers fonts-dejavu-core
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- copilot-canvas selftest --client gui || { cat /tmp/copilot-canvas-selftest-*/gui-stderr.log; exit 1; }
          sudo apt-get remove -y -q copilot-canvas
          test ! -e /usr/bin/copilot-canvas
      - name: tarball installs into a prefix
        run: |
          tar -xzf dist/copilot-canvas-*-linux-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP"
          PREFIX="$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/copilot-canvas-*/install.sh
          "$RUNNER_TEMP/prefix/bin/copilot-canvas" --version
          test -f "$RUNNER_TEMP/prefix/share/applications/copilot-canvas.desktop"
          PREFIX="$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/copilot-canvas-*/install.sh --uninstall
          test ! -e "$RUNNER_TEMP/prefix/bin/copilot-canvas"
      - name: AppImage runs (extracted, no FUSE on runners)
        run: |
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Copilot_Canvas-*-${{ matrix.arch }}.AppImage cli --version
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Copilot_Canvas-*-${{ matrix.arch }}.AppImage --version
      - name: .rpm on Fedora (container)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD/dist:/dist" fedora:41 sh -c 'dnf install -y -q --setopt=install_weak_deps=False /dist/copilot-canvas-*.x86_64.rpm && copilot-canvas --version && copilot-canvas-gui --version && (copilot-canvas doctor || true) && rpm -e copilot-canvas'
