# Continuous integration (PLAN.md §5 "Every phase ends green", §11 "Pin Zig;
# cache the lib by checksum; a separate CI job"). Windows only: ConPTY, named
# pipes and job objects are part of what is tested.
name: ci

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: "b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428"

jobs:
  # Builds the pinned libghostty-vt once per pin; the library is cached by the
  # checksum file that holds the Ghostty commit and Zig version.
  ghostty:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v6
        with:
          path: target/ghostty
          key: ghostty-${{ hashFiles('crates/ghostty-vt-sys/vendor/CHECKSUMS.sha256') }}
      - name: Install Zig ${{ env.ZIG_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\zig.zip"
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:ZIG_SHA256) { throw "Zig checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "ZIG=$env:RUNNER_TEMP\zig-x86_64-windows-$env:ZIG_VERSION\zig.exe" >> $env:GITHUB_ENV
      - name: cargo xtask build-ghostty
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask build-ghostty
      - uses: actions/upload-artifact@v7
        with:
          name: ghostty
          path: target/ghostty

  test:
    needs: ghostty
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The Rust cache first: when it restores a partial match (Cargo.lock
      # changed) it cleans target/, which would remove the library below.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: ghostty
          path: target/ghostty
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes canvas-core's ViewModel snapshot tests (tests/view_snapshots.rs):
      # fixed inputs, so they are the same on every machine.
      - name: unit and integration tests
        run: cargo test --workspace
      - name: alacritty-only build (no Zig)
        run: cargo build --no-default-features
      - name: release build
        run: cargo build --release
      - name: golden corpus (both engines)
        run: target\release\copilot-canvas.exe corpus check
      - name: TUI self-test
        run: target\release\copilot-canvas.exe selftest
      - name: TUI self-test over loopback TCP
        run: target\release\copilot-canvas.exe selftest --remote loopback
      - name: remote fault injection
        run: target\release\copilot-canvas.exe selftest --remote faults
      - name: pairing and the Dev Tunnel stand-in
        run: target\release\copilot-canvas.exe selftest --remote paired
      # The GUI runs on WARP (no GPU on hosted runners); offscreen rendering and
      # the test hooks need no interactive desktop.
      - name: GUI self-test
        run: target\release\copilot-canvas.exe selftest --client gui
      - name: GUI parity suite
        run: target\release\copilot-canvas.exe selftest --client gui --parity
      # The goldens were captured on the reference machine (RTX 3070, 125 % DPI,
      # its font versions). Hosted runners draw with WARP at 100 % DPI, so the
      # size and anti-aliasing differ and this step may fail there without a
      # regression: it reports, it does not block. The diff images are kept.
      - name: GUI golden screenshots (reference machine only)
        continue-on-error: true
        run: target\release\copilot-canvas.exe selftest --client gui --golden
      - name: keep golden diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs
          path: |
            tests/golden/gui/*.actual.png
            tests/golden/gui/*.diff.png
          if-no-files-found: ignore

  # The iPhone app (docs/IOS-PLAN.md): the portable crates on macOS, the Rust
  # core for iOS, the app on a simulator with its unit tests and its UI tests
  # against the mock service.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: portable crates (clippy, tests)
        run: |
          rustup component add clippy
          cargo clippy -p canvas-common -p canvas-model -p canvas-termview -p canvas-push -p canvas-mobile -p canvas-mock --all-targets -- -D warnings
          cargo clippy -p canvas-host --no-default-features --all-targets -- -D warnings
          cargo test -p canvas-common -p canvas-model -p canvas-termview -p canvas-push -p canvas-mobile -p canvas-mock
          cargo test -p canvas-host --no-default-features
      - name: the Rust core for iOS
        run: ios/build-core.sh
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen
      # The UI tests pair with two mock services and wait for their first data:
      # both mocks listen and the simulator has booted before any test starts
      # (a cold boot during the first test ate its waits), one simulator at a
      # time, and a failure keeps the result bundle and the mocks' logs.
      - name: app tests on a simulator (unit, and UI against the mock)
        run: |
          cargo build -p canvas-mock
          logs="$RUNNER_TEMP/ios-logs"
          mkdir -p "$logs"
          target/debug/canvas-mock --quiet > "$logs/mock.log" 2>&1 &
          target/debug/canvas-mock --quiet --listen 127.0.0.1:47601 --state "$RUNNER_TEMP/canvas-mock-personal" > "$logs/mock-personal.log" 2>&1 &
          for port in 47600 47601; do
            for i in $(seq 1 120); do nc -z 127.0.0.1 "$port" && break; sleep 0.5; done
            nc -z 127.0.0.1 "$port" || { echo "the mock on port $port does not listen"; cat "$logs"/*.log; exit 1; }
          done
          echo "both mocks listen"
          # An iPhone 16 when the runner image has one, else its first iPhone simulator.
          DEVICE="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          fi
          UDID=$(xcrun simctl list devices available | grep -m1 "    $DEVICE (" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "simulator: $DEVICE ($UDID)"
          # The on-screen keyboard (a connected hardware keyboard hides it; the tests look for it).
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # iOS's one-time slide-to-type tip would cover the keyboard and the
          # app's key bar the first time it shows (the tests close it too).
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          cd ios
          COPILOT_CANVAS_SKIP_CORE=1 xcodebuild -project CopilotCanvas.xcodeproj -scheme CopilotCanvas \
            -destination "platform=iOS Simulator,id=$UDID" -parallel-testing-enabled NO \
            -resultBundlePath "$logs/tests.xcresult" test
      - name: keep the iOS test results and the mocks' logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests
          path: ${{ runner.temp }}/ios-logs
          if-no-files-found: ignore
